<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<title>AUTO DRAW</title>

<style>
body {
    background:#f2f2f2;
    font-family: sans-serif;
    padding:20px;
}
.box{
    max-width:420px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}
button{
    width:100%;
    padding:14px;
    border-radius:10px;
    font-weight:900;
    border:none;
    background:#111;
    color:#fff;
    cursor:pointer;
    margin-top:10px;
}
.status{
    text-align:center;
    font-weight:bold;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="box">

<!-- ✅ የአንተ ትክክለኛ source code -->
<select id="auto-speed" style="width:100%; padding:14px; border-radius:10px; font-weight:900; margin-bottom:10px;">
    <option value="2000">AUTO – 2 ሰከንድ</option>
    <option value="3000">AUTO – 3 ሰከንድ</option>
    <option value="4000">AUTO – 4 ሰከንድ</option>
    <option value="5000">AUTO – 5 ሰከንድ</option>
</select>

<button id="stop">⛔ STOP AUTO</button>

<div class="status" id="status">AUTO DRAW አልተጀመረም</div>

</div>

<script>
let autoInterval = null;

function autoDraw(){
    console.log("🔥 AUTO DRAW RUNNING");
    // እዚህ የራስህን draw function አስገባ
}

document.getElementById("auto-speed").addEventListener("change",function(){
    const speed = parseInt(this.value);
    clearInterval(autoInterval);

    autoInterval = setInterval(autoDraw, speed);

    document.getElementById("status").innerText =
        "AUTO DRAW በ " + (speed/1000) + " ሰከንድ እየሰራ ነው ✅";
});

document.getElementById("stop").addEventListener("click",function(){
    clearInterval(autoInterval);
    document.getElementById("status").innerText = "AUTO DRAW ተቋርጧል ⛔";
});
</script>

</body>
</html>

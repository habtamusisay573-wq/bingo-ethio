<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ETHIO BINGO V19.2 - ADMIN PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');
        :root { --gold: linear-gradient(135deg, #fceabb 0%, #fccd4d 50%, #f8b500 51%, #fbdf93 100%); --dark: #0f172a; }
        body { background: var(--dark); color: white; font-family: 'Poppins', sans-serif; margin: 0; overflow: hidden; user-select: none; height: 100vh; }
        
        #splash { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .logo-anim { font-size: 3rem; font-weight: 900; background: var(--gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: zoom 2s infinite; }
        @keyframes zoom { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        .header { background: #1e293b; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #facc15; height: 60px; box-sizing: border-box; }
        .bal-txt { color: #facc15; font-weight: 900; font-size: 1.2rem; }
        .page { display: none; padding: 15px; height: calc(100vh - 60px); overflow-y: auto; box-sizing: border-box; }
        .active { display: block; }
        
        .board-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding-bottom: 80px; }
        .board-btn { aspect-ratio: 1; background: #1e293b; border: 2px solid #facc15; color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 900; }
        .reserved { background: #334155; border-color: #ef4444; color: #ef4444; opacity: 0.6; pointer-events: none; }

        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 10px; }
        .cell { aspect-ratio: 1; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; font-weight: 900; border-radius: 6px; font-size: 1.1rem; }
        .marked { background: #ef4444 !important; color: white !important; }
        .hint { border: 3px solid #facc15; background: #fef08a; }

        .ball-main { width: 80px; height: 80px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 2.2rem; font-weight: 900; margin: 5px auto; border: 3px solid #fff; }
        .hist-box { display: flex; gap: 5px; justify-content: center; margin-bottom: 10px; }
        .hist-ball { width: 30px; height: 30px; background: #334155; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; border: 1px solid #facc15; }

        .btn { background: var(--gold); border: none; padding: 15px; border-radius: 12px; font-weight: 900; width: 100%; color: #422006; cursor: pointer; margin-top: 10px; font-size: 1rem; }
        .input { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #facc15; background: #1e293b; color: white; box-sizing: border-box; margin-top: 10px; }
        
        #winner-msg { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .req-card { background: #1e293b; padding: 12px; margin-top: 8px; border-radius: 10px; border-left: 5px solid #facc15; }
    </style>
</head>
<body>

<div id="splash">
    <div class="logo-anim">ETHIO BINGO</div>
    <div style="color: #facc15; letter-spacing: 2px;">V19.2 ADMIN MASTER</div>
</div>

<div id="winner-msg">
    <h1 style="color: #facc15; font-size: 3rem;">BINGO!</h1>
    <h2 id="winner-name">---</h2>
</div>

<div class="header">
    <div>
        <div id="u-name" style="font-weight: 700; font-size: 0.9rem;">Loading...</div>
        <div style="font-size: 10px; color: #22c55e;">● Online: <span id="online-count">0</span></div>
    </div>
    <div style="text-align: right;">
        <div id="u-bal" class="bal-txt">0.00 ETB</div>
    </div>
</div>

<div id="home-page" class="page active">
    <div id="player-ui">
        <h3 style="text-align: center; color: #facc15; margin-top: 0;">ውርርድ ይምረጡ</h3>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
            <button class="btn" onclick="checkBet(10)">10 ETB</button>
            <button class="btn" onclick="checkBet(20)">20 ETB</button>
            <button class="btn" onclick="checkBet(50)">50 ETB</button>
            <button class="btn" onclick="checkBet(100)">100 ETB</button>
            <button class="btn" onclick="checkBet(200)">200 ETB</button>
            <button class="btn" onclick="checkBet(500)">500 ETB</button>
        </div>
        <button class="btn" onclick="checkBet(1000)">1000 ETB 🔥</button>
        
        <div style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn" style="background: #22c55e; color: white;" onclick="showP('dep-page')">ብር አስገባ</button>
            <button class="btn" style="background: #3b82f6; color: white;" onclick="showP('wit-page')">ብር አውጣ</button>
        </div>
    </div>
    <button id="adm-gate" class="btn" style="display:none; background: #64748b; margin-top: 20px;" onclick="showP('admin-page')">⚙️ የዳኛ ገፅ (Manage)</button>
</div>

<div id="reserve-page" class="page">
    <h3 style="text-align: center; margin-top: 0;">ካርቴላ ይምረጡ (1-200)</h3>
    <div id="board-list" class="board-selector"></div>
    <div style="position: fixed; bottom: 0; left: 0; width: 100%; padding: 15px; background: #0f172a;">
        <button class="btn" style="background: #ef4444; color: white; margin:0;" onclick="showP('home-page')">ተመለስ</button>
    </div>
</div>

<div id="game-page" class="page">
    <div class="hist-box" id="history"></div>
    <div class="ball-main" id="current-ball">?</div>
    <div id="bingo-grid" class="grid"></div>
</div>

<div id="dep-page" class="page">
    <h3>ብር ማስገቢያ</h3>
    <input type="number" id="d-amt" class="input" placeholder="መጠን">
    <input type="text" id="d-ref" class="input" placeholder="Ref No">
    <button class="btn" onclick="sendDep()">ጥያቄ ላክ</button>
    <button class="btn" style="background: #475569;" onclick="showP('home-page')">ተመለስ</button>
</div>

<div id="wit-page" class="page">
    <h3>ብር ማውጫ</h3>
    <input type="number" id="w-amt" class="input" placeholder="መጠን">
    <button class="btn" onclick="sendWit()">ማውጫ ጠይቅ</button>
    <button class="btn" style="background: #475569;" onclick="showP('home-page')">ተመለስ</button>
</div>

<div id="admin-page" class="page">
    <h2 style="text-align: center; margin-top: 0;">የዳኛ ገፅ</h2>
    <div class="ball-main" id="adm-ball">?</div>
    
    <div style="background: #1e293b; padding: 15px; border-radius: 15px; border: 1px solid #facc15;">
        <label style="font-size: 12px; color: #94a3b8;">የመጥሪያ ፍጥነት (ሰከንድ):</label>
        <select id="draw-speed" class="input" style="margin-top: 5px;">
            <option value="3000">3 ሰከንድ</option>
            <option value="5000" selected>5 ሰከንድ</option>
            <option value="8000">8 ሰከንድ</option>
        </select>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button id="start-auto" class="btn" style="background: #22c55e; color: white; margin:0;" onclick="toggleAutoDraw(true)">ጀምር</button>
            <button id="stop-auto" class="btn" style="background: #ef4444; color: white; margin:0; display: none;" onclick="toggleAutoDraw(false)">አቁም</button>
        </div>
        <button class="btn" style="background: #facc15; color: black;" onclick="drawNum()">አንድ ቁጥር አውጣ</button>
    </div>

    <button class="btn" style="background: #ef4444; color: white; margin-top: 15px;" onclick="resetAll()">ጌሙን አዲስ ጀምር (RESET)</button>
    
    <h3 style="margin-top: 20px; color: #facc15;">የተጫዋቾች ጥያቄ (In/Out)</h3>
    <div id="adm-reqs"></div>
    <button class="btn" style="background: #475569;" onclick="showP('home-page')">ወደ ዋናው ገፅ</button>
</div>

<script>
    const ADMIN_ID = 8431270634;
    const fb = firebase.initializeApp({ databaseURL: "https://dagi-bingo-default-rtdb.firebaseio.com/" });
    const db = fb.database();
    const tg = window.Telegram.WebApp; tg.expand();

    const user = tg.initDataUnsafe.user || { id: "USR_" + Date.now(), first_name: "ተጫዋች" };
    document.getElementById('u-name').innerText = user.first_name;
    
    // Admin Check: Hide player buttons and show admin gate
    if(user.id == ADMIN_ID) {
        document.getElementById('adm-gate').style.display = 'block';
        document.getElementById('player-ui').style.display = 'none'; // Admin doesn't need betting UI
    }

    let myBal = 0, drawn = [], myBoard = [], currentBet = 0, autoInterval = null;

    setTimeout(() => document.getElementById('splash').style.display = 'none', 3000);
    db.ref('online/' + user.id).set(true); db.ref('online/' + user.id).onDisconnect().remove();
    db.ref('online').on('value', s => document.getElementById('online-count').innerText = s.numChildren());

    db.ref('users/' + user.id + '/bal').on('value', s => {
        myBal = s.val() || 0;
        document.getElementById('u-bal').innerText = myBal.toFixed(2) + " ETB";
    });

    function showP(id) { 
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'reserve-page') loadBoards();
    }

    function checkBet(amt) {
        if(myBal < amt) return alert("በቂ ባላንስ የለም!");
        currentBet = amt;
        showP('reserve-page');
    }

    function loadBoards() {
        db.ref('reserved_boards').on('value', s => {
            const list = document.getElementById('board-list'); if(!list) return;
            list.innerHTML = "";
            const taken = s.val() || {};
            for(let i=1; i<=200; i++) {
                let b = document.createElement('div');
                b.className = "board-btn" + (taken[i] ? " reserved" : "");
                b.innerText = i;
                b.onclick = () => {
                    db.ref('reserved_boards/' + i).set(user.id);
                    db.ref('users/' + user.id + '/bal').transaction(c => (c || 0) - currentBet);
                    startBingo();
                };
                list.appendChild(b);
            }
        });
    }

    function startBingo() {
        showP('game-page');
        let nums = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5).slice(0, 24);
        myBoard = [];
        const grid = document.getElementById('bingo-grid'); grid.innerHTML = "";
        for(let i=0; i<25; i++) {
            let val = (i === 12) ? "FREE" : nums.pop();
            myBoard.push(val);

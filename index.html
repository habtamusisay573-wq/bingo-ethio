<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DAGI BINGO V19.3 PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');
        :root { --gold: linear-gradient(135deg, #fceabb 0%, #fccd4d 50%, #f8b500 51%, #fbdf93 100%); --dark: #0f172a; }
        body { background: var(--dark); color: white; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; user-select: none; }
        
        #splash { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.5s; }
        .logo-anim { font-size: 3rem; font-weight: 900; background: var(--gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: zoom 2s infinite; }
        @keyframes zoom { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        .header { background: #1e293b; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #facc15; position: sticky; top: 0; z-index: 1000; }
        .page { display: none; padding: 15px; min-height: 90vh; box-sizing: border-box; }
        .active { display: block; }
        
        .btn { background: var(--gold); border: none; padding: 14px; border-radius: 12px; font-weight: 900; width: 100%; color: #422006; cursor: pointer; margin-top: 10px; font-size: 0.9rem; }
        .input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #facc15; background: #1e293b; color: white; box-sizing: border-box; margin-top: 10px; }
        
        /* History Styles */
        .hist-card { background: #1e293b; padding: 12px; margin-bottom: 10px; border-radius: 10px; border-left: 4px solid #facc15; font-size: 0.85rem; }
        .hist-time { font-size: 0.7rem; color: #94a3b8; display: block; margin-top: 5px; }
        .tab-btn { flex: 1; padding: 10px; background: #334155; border: none; color: white; font-weight: bold; }
        .tab-btn.active-tab { background: #facc15; color: black; }

        /* Bingo Styles */
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 10px; }
        .cell { aspect-ratio: 1; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; font-weight: 900; border-radius: 6px; font-size: 1.1rem; }
        .marked { background: #ef4444 !important; color: white !important; }
        .ball-main { width: 80px; height: 80px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 2.2rem; font-weight: 900; margin: 10px auto; border: 3px solid #fff; }
    </style>
</head>
<body>

<div id="splash">
    <div class="logo-anim">DAGI BINGO</div>
    <div style="color: #facc15; letter-spacing: 2px;">V19.3 HISTORY EDITION</div>
</div>

<div id="main-ui" style="display:none;">
    <div class="header">
        <div>
            <div id="u-name" style="font-weight: 700;">Loading...</div>
            <div style="font-size: 10px; color: #22c55e;">Online: <span id="online-count">0</span></div>
        </div>
        <div id="u-bal" style="color: #facc15; font-weight: 900;">0.00 ETB</div>
    </div>

    <div id="home-page" class="page active">
        <button class="btn" style="background: #3b82f6; color: white; margin-bottom: 15px;" onclick="showP('history-page')">📜 የታሪክ ማህደር (History)</button>
        
        <div id="player-ui">
            <h3 style="text-align: center; color: #facc15;">ውርርድ ይምረጡ</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="btn" onclick="checkBet(10)">10 ETB</button>
                <button class="btn" onclick="checkBet(20)">20 ETB</button>
                <button class="btn" onclick="checkBet(50)">50 ETB</button>
                <button class="btn" onclick="checkBet(100)">100 ETB</button>
            </div>
            <div style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="btn" style="background: #22c55e; color: white;" onclick="showP('dep-page')">ብር አስገባ</button>
                <button class="btn" style="background: #ef4444; color: white;" onclick="showP('wit-page')">ብር አውጣ</button>
            </div>
        </div>
        <button id="adm-gate" class="btn" style="display:none; background: #64748b; margin-top: 20px;" onclick="showP('admin-page')">⚙️ የዳኛ ገፅ</button>
    </div>

    <div id="history-page" class="page">
        <h3 style="text-align: center;">📜 የጨዋታና የገንዘብ ታሪክ</h3>
        <div style="display: flex; margin-bottom: 15px;">
            <button id="tab-game" class="tab-btn active-tab" onclick="switchTab('game')">የጨዋታ</button>
            <button id="tab-money" class="tab-btn" onclick="switchTab('money')">የገንዘብ</button>
        </div>
        <div id="history-list"></div>
        <button class="btn" style="background: #475569; color: white;" onclick="showP('home-page')">ተመለስ</button>
    </div>

    <div id="reserve-page" class="page">
        <h3 style="text-align: center;">ካርቴላ ይምረጡ</h3>
        <div id="board-list" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;"></div>
        <button class="btn" style="background: #ef4444; color: white; margin-top: 20px;" onclick="showP('home-page')">ሰርዝ</button>
    </div>

    <div id="game-page" class="page">
        <div class="ball-main" id="current-ball">?</div>
        <div id="bingo-grid" class="grid"></div>
    </div>

    <div id="dep-page" class="page">
        <h3>ብር ማስገቢያ</h3>
        <input type="number" id="d-amt" class="input" placeholder="መጠን">
        <input type="text" id="d-ref" class="input" placeholder="Transaction ID">
        <button class="btn" onclick="sendDep()">ጥያቄ ላክ</button>
    </div>

    <div id="wit-page" class="page">
        <h3>ብር ማውጫ</h3>
        <input type="number" id="w-amt" class="input" placeholder="መጠን">
        <button class="btn" onclick="sendWit()">ጥያቄ ላክ</button>
    </div>

    <div id="admin-page" class="page">
        <h3>የዳኛ ዳሽቦርድ</h3>
        <div class="ball-main" id="adm-ball">?</div>
        <button class="btn" style="background: #22c55e; color: white;" onclick="toggleAutoDraw(true)">ጀምር</button>
        <button class="btn" style="background: #ef4444; color: white;" onclick="toggleAutoDraw(false)">አቁም</button>
        <button class="btn" style="background: #ef4444; color: white; margin-top: 20px;" onclick="resetAll()">RESET</button>
        <div id="adm-reqs"></div>
        <button class="btn" onclick="showP('home-page')">ተመለስ</button>
    </div>
</div>

<script>
    const ADMIN_ID = 8431270634;
    const firebaseConfig = { databaseURL: "https://dagi-bingo-default-rtdb.firebaseio.com/" };
    const fb = firebase.initializeApp(firebaseConfig);
    const db = fb.database();
    const tg = window.Telegram.WebApp; tg.expand();

    const user = tg.initDataUnsafe.user || { id: "USR_" + Date.now(), first_name: "ተጫዋች" };
    document.getElementById('u-name').innerText = user.first_name;

    if(user.id == ADMIN_ID) {
        document.getElementById('adm-gate').style.display = 'block';
        document.getElementById('player-ui').style.display = 'none';
    }

    let myBal = 0, currentTab = 'game', myBoard = [], drawn = [], currentBet = 0;

    window.onload = () => {
        setTimeout(() => {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('main-ui').style.display = 'block';
            }, 500);
        }, 3000);
    };

    // Firebase Listeners
    db.ref('users/' + user.id + '/bal').on('value', s => {
        myBal = s.val() || 0;
        document.getElementById('u-bal').innerText = myBal.toFixed(2) + " ETB";
    });

    // History Logic
    function switchTab(type) {
        currentTab = type;
        document.getElementById('tab-game').classList.toggle('active-tab', type === 'game');
        document.getElementById('tab-money').classList.toggle('active-tab', type === 'money');
        loadHistory();
    }

    function loadHistory() {
        const path = currentTab === 'game' ? 'history/games' : 'history/money';
        db.ref(path).limitToLast(20).on('value', s => {
            const list = document.getElementById('history-list');
            list.innerHTML = "";
            let items = [];
            s.forEach(child => { items.unshift(child.val()); });
            
            items.forEach(h => {
                let d = document.createElement('div');
                d.className = "hist-card";
                if(currentTab === 'game') {
                    d.innerHTML = `🏆 <b>አሸናፊ: ${h.winner}</b><br>💰 የሽልማት መጠን: ${h.prize} ETB <span class="hist-time">${h.time}</span>`;
                } else {
                    let color = h.type === 'ገቢ' ? 'lime' : 'orange';
                    d.innerHTML = `👤 <b>${h.name}</b><br>የተደረገ: <b style="color:${color}">${h.type}</b> | መጠን: ${h.amt} ETB <span class="hist-time">${h.time}</span>`;
                }
                list.appendChild(d);
            });
        });
    }

    function logHistory(path, data) {
        data.time = new Date().toLocaleString('en-US', { hour: 'numeric', minute: 'numeric', hour12: true, day: 'numeric', month: 'short' });
        db.ref('history/' + path).push(data);
    }

    // Winner Logger (In Win Logic)
    db.ref('game/winner').on('value', s => {
        const w = s.val();
        if(w) {
            if(user.id == ADMIN_ID) { // Log only once by Admin
                logHistory('games', { winner: w.name, prize: currentBet * 10 }); // Example prize
            }
            // Show winner popup and confetti...
        }
    });

    // Approval Logger (In Admin Approval)
    function approveReq(key, uid, amt, type, name) {
        let change = (type === 'DEP') ? amt : -amt;
        db.ref('users/' + uid + '/bal').transaction(c => (c || 0) + change);
        db.ref('reqs/' + key).remove();
        logHistory('money', { name: name, amt: amt, type: type === 'DEP' ? 'ገቢ' : 'ወጪ' });
    }

    // Basic Page Switcher
    function showP(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'history-page') loadHistory();
    }

    // --- (The rest of Bingo Logic from V19.2 goes here) ---
    // (checkBet, loadBoards, startBingo, drawNum, toggleAutoDraw, resetAll etc.)
    // Note: In approveReq inside Admin listener, make sure to pass 'r.name'
</script>
</body>
</html>

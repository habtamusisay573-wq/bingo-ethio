<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DAGI BINGO V22 - FIXED RECOVERY</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');
        :root { 
            --gold: linear-gradient(135deg, #fceabb 0%, #fccd4d 50%, #f8b500 51%, #fbdf93 100%); 
            --dark: #0f172a; --danger: #ef4444; --success: #22c55e;
        }
        body { background: var(--dark); color: white; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; user-select: none; }
        .header { background: rgba(30, 41, 59, 0.9); padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #facc15; }
        .page { display: none; padding: 12px; }
        .active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 340px; margin: 10px auto; }
        .cell { aspect-ratio: 1; background: #fff; color: #1e293b; display: flex; align-items: center; justify-content: center; font-weight: 900; border-radius: 8px; font-size: 1.1rem; border: 2px solid #ccc; }
        .marked { background: var(--danger) !important; color: white !important; }
        #board-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; height: 50vh; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.2); }
        .board-item { background: var(--gold) !important; color: #422006 !important; height: 50px; }
        .board-taken { opacity: 0.3; pointer-events: none; }
        .my-selection { border: 3px solid #fff !important; box-shadow: 0 0 10px #facc15; }
        .btn { background: var(--gold); border: none; padding: 15px; border-radius: 12px; font-weight: 900; width: 100%; margin-top: 10px; cursor: pointer; color: #422006; }
        .btn-back { background: #475569; color: white; }
        .prize-box { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; border-radius: 8px; padding: 5px; text-align: center; }
        #current-ball { width: 75px; height: 75px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 2rem; font-weight: 900; margin: 10px auto; border: 3px solid #fff; }
        .req-card { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #facc15; }
    </style>
</head>
<body>

<div id="main-ui">
    <div class="header">
        <div>
            <div id="u-name" style="font-weight: 900; color: #facc15;">---</div>
            <div class="prize-box">
                <div style="font-size: 8px; color: white;">ጃክፖት (80%)</div>
                <div id="jackpot-display" style="color: #22c55e; font-weight: 900;">0.00 ETB</div>
            </div>
        </div>
        <div style="text-align: right;"><div id="u-bal" style="font-weight: 900; color: #facc15;">0.00 ETB</div></div>
    </div>

    <div id="home-page" class="page active">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn" onclick="checkBet(10)">10 ETB</button>
            <button class="btn" onclick="checkBet(50)">50 ETB</button>
            <button class="btn" onclick="checkBet(100)">100 ETB</button>
            <button class="btn" onclick="checkBet(500)">500 ETB</button>
        </div>
        <button class="btn" style="background:#3b82f6; color:white;" onclick="showP('history-page')">📜 የሂሳብ ታሪክ</button>
        <button class="btn" style="background:#22c55e; color:white;" onclick="showP('deposit-page')">➕ ብር አስገባ</button>
        <button id="adm-gate" class="btn" style="display:none; background:#991b1b; color:white;" onclick="showP('admin-page')">⚙️ ዳኛ Dashboard</button>
    </div>

    <div id="game-page" class="page">
        <div id="status-text" style="text-align:center; color:#facc15; font-weight:bold;">ጨዋታ በመጠባበቅ ላይ...</div>
        <div id="current-ball">?</div>
        <div id="bingo-grid" class="grid"></div>
        <button id="bingo-btn" class="btn" style="background:red; color:white;" onclick="claimBingo()">BINGO! 🏆</button>
        <button class="btn btn-back" onclick="safeBack()">ተመለስ</button>
    </div>

    <div id="reserve-page" class="page">
        <h3 style="text-align:center;">ካርቴላ ይምረጡ (1-200)</h3>
        <div id="board-list"></div>
        <button class="btn btn-back" onclick="showP('home-page')">ተመለስ</button>
    </div>

    <div id="history-page" class="page">
        <h3 style="text-align:center;">የእንቅስቃሴ ታሪክ</h3>
        <div id="hist-list"></div>
        <button class="btn btn-back" onclick="showP('home-page')">ተመለስ</button>
    </div>

    <div id="admin-page" class="page">
        <h3 style="text-align:center;">ዳኛ Dashboard</h3>
        <div id="admin-req-list"></div>
        <button class="btn btn-back" onclick="showP('home-page')">ተመለስ</button>
    </div>

    <div id="deposit-page" class="page">
        <h3>ብር ማስገቢያ</h3>
        <input type="number" id="dep-amt" placeholder="መጠን" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="text" id="dep-info" placeholder="Transaction ID / ስም" style="width:100%; padding:10px; margin-bottom:10px;">
        <button class="btn" onclick="reqFinance()">ጥያቄ ላክ</button>
        <button class="btn btn-back" onclick="showP('home-page')">ተመለስ</button>
    </div>
</div>

<script>
    const ADMIN_ID = 8431270634;
    const fb = firebase.initializeApp({ databaseURL: "https://dagi-bingo-default-rtdb.firebaseio.com/" });
    const db = fb.database();
    const tg = window.Telegram.WebApp;
    const user = tg.initDataUnsafe.user || { id: "GUEST_" + Date.now(), first_name: "Player" };

    if(user.id == ADMIN_ID) document.getElementById('adm-gate').style.display = 'block';

    let myBal = 0, drawn = [], markedCells = [12], currentBet = 0, myBoardID = null;

    function syncUser() {
        db.ref('users/' + user.id + '/bal').on('value', s => {
            myBal = s.val() || 0;
            document.getElementById('u-bal').innerText = myBal.toFixed(2) + " ETB";
        });

        // RECOVERY: ቼክ የሚደረገው ጨዋታው 'active' ወይም 'waiting' ከሆነ ብቻ ነው
        db.ref('game/status').on('value', statusSnap => {
            const status = statusSnap.val();
            if (status === 'active' || status === 'waiting') {
                db.ref('reserved_boards').once('value', s => {
                    const taken = s.val() || {};
                    for(let id in taken) {
                        if(taken[id] === user.id) {
                            myBoardID = id;
                            db.ref('game/currentBetPrice').once('value', b => {
                                currentBet = b.val() || 10;
                                startBingoUI();
                                showP('game-page');
                            });
                        }
                    }
                });
            } else if (status === 'idle') {
                // ጨዋታው ካለቀ ተጫዋቹን ወደ ሆም መልሰው
                if (myBoardID) {
                    myBoardID = null;
                    showP('home-page');
                }
            }
        });

        // ታሪክ መጫን
        db.ref('history/' + user.id).limitToLast(10).on('value', s => {
            const list = document.getElementById('hist-list'); list.innerHTML = "";
            const data = s.val();
            if(data) {
                Object.values(data).reverse().forEach(h => {
                    list.innerHTML += `<div class="req-card"><b>${h.type}</b>: ${h.amt} ETB<br><small>${h.date}</small></div>`;
                });
            }
        });
    }

    function checkBet(amt) {
        if(myBal < amt) return alert("በቂ ባላንስ የለም!");
        db.ref('game/status').once('value', s => {
            if(s.val() === 'active') return alert("ጨዋታው ተጀምሯል! ቀጣዩን ጠብቅ።");
            currentBet = amt;
            showP('reserve-page');
        });
    }

    function loadBoards() {
        db.ref('reserved_boards').on('value', s => {
            const list = document.getElementById('board-list'); list.innerHTML = "";
            const taken = s.val() || {};
            for(let i=1; i<=200; i++) {
                let b = document.createElement('div');
                let isTaken = taken[i] && taken[i] !== user.id;
                b.className = "cell board-item" + (isTaken ? " board-taken" : "") + (taken[i] === user.id ? " my-selection" : "");
                b.innerText = i;
                b.onclick = () => { if(!isTaken) buyBoard(i); };
                list.appendChild(b);
            }
            const pool = Object.keys(taken).length * currentBet;
            document.getElementById('jackpot-display').innerText = (pool * 0.8).toFixed(2) + " ETB";
        });
    }

    function buyBoard(id) {
        db.ref('users/'+user.id+'/bal').transaction(c => {
            if(c >= currentBet) {
                db.ref(`history/${user.id}`).push({ type: "ግዢ", amt: -currentBet, date: new Date().toLocaleString() });
                return c - currentBet;
            }
            return c;
        });
        db.ref('reserved_boards/' + id).set(user.id);
        db.ref('game/currentBetPrice').set(currentBet);
        myBoardID = id;
        startBingoUI();
        showP('game-page');
        
        db.ref('game/status').once('value', s => {
            if(s.val() === 'idle') {
                db.ref('game').update({ status: 'waiting', timer: 30 });
            }
        });
    }

    function startBingoUI() {
        let seed = myBoardID * 777;
        let nums = Array.from({length: 75}, (_, i) => i + 1);
        nums.sort(() => (seed = (seed * 9301 + 49297) % 233280) / 233280 - 0.5);
        markedCells = [12];
        const grid = document.getElementById('bingo-grid'); grid.innerHTML = "";
        for(let i=0; i<25; i++) {
            let val = (i === 12) ? "FREE" : nums[i];
            let c = document.createElement('div'); c.className = 'cell' + (i===12 ? " marked" : "");
            c.innerText = val;
            c.onclick = () => { if(drawn.includes(val) || val === "FREE") { c.classList.add('marked'); if(!markedCells.includes(i)) markedCells.push(i); } };
            grid.appendChild(c);
        }
    }

    db.ref('game/drawn').on('value', s => {
        drawn = s.val() || [];
        document.getElementById('current-ball').innerText = drawn[drawn.length-1] || "?";
    });

    db.ref('game/timer').on('value', s => {
        const t = s.val();
        if(t > 0) document.getElementById('status-text').innerText = "ጨዋታ ለመጀመር " + t + " ሰከንድ ቀረው...";
        else if(t === 0) document.getElementById('status-text').innerText = "ጨዋታው ተጀምሯል!";
    });

    function safeBack() {
        if(confirm("ከገጹ መውጣት ትፈልጋለህ? (ይህ ካርቴላህን አያጠፋውም)")) showP('home-page');
    }

    function showP(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'reserve-page') loadBoards();
    }

    syncUser();
</script>
</body>
</html>

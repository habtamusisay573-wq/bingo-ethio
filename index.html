<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DAGI BINGO V20.2 ULTIMATE MASTER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');
        :root { --gold: linear-gradient(135deg, #fceabb 0%, #fccd4d 50%, #f8b500 51%, #fbdf93 100%); --dark: #0f172a; --danger: #ef4444; --success: #22c55e; --blue: #3b82f6; }
        body { background: var(--dark); color: white; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; user-select: none; overflow-x: hidden; }

        /* 1. Splash Screen */
        #splash { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .logo-anim { font-size: 3rem; font-weight: 900; background: var(--gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: zoom 2s infinite; }
        @keyframes zoom { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        /* Header & 12. Online Counter */
        .header { background: #1e293b; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #facc15; position: sticky; top:0; z-index:100; }
        .page { display: none; padding: 15px; box-sizing: border-box; min-height: 90vh; }
        .active { display: block; }

        /* 7. Manual Marking Grid */
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
        .cell { aspect-ratio: 1; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; font-weight: 900; border-radius: 8px; font-size: 1.2rem; cursor: pointer; border: 3px solid transparent; transition: 0.2s; }
        .marked { background: var(--danger) !important; color: white !important; transform: scale(0.9); box-shadow: 0 0 10px var(--danger); }
        .hint { border: 3px solid #facc15; animation: glow 0.8s infinite alternate; }
        @keyframes glow { from { box-shadow: 0 0 2px #facc15; } to { box-shadow: 0 0 12px #facc15; } }

        /* Buttons */
        .btn { background: var(--gold); border: none; padding: 16px; border-radius: 12px; font-weight: 900; color: #422006; cursor: pointer; width: 100%; margin-top: 10px; font-size: 1rem; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn-red { background: var(--danger); color: white; }
        .btn-green { background: var(--success); color: white; }
        .btn-blue { background: var(--blue); color: white; }

        /* 5. Card Selection */
        .board-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; height: 400px; overflow-y: auto; padding: 10px; background: #1e293b; border-radius: 10px; }
        .board-btn { aspect-ratio: 1; background: #334155; border: 2px solid #facc15; color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; }
        .reserved { opacity: 0.2; pointer-events: none; grayscale: 1; }

        /* Finance Request Card */
        .req-card { background: #1e293b; padding: 12px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid #facc15; }
    </style>
</head>
<body>

<div id="splash"><div class="logo-anim">DAGI BINGO</div><p>V20.2 ULTIMATE</p></div>

<div id="main-ui" style="display:none;">
    <div class="header">
        <div>
            <div id="u-name" style="font-weight: 900; color: #facc15;">---</div>
            <div style="font-size: 10px; color: #22c55e;">Online: <span id="online-count">1</span></div>
        </div>
        <div style="text-align: right;">
            <div id="u-bal" style="font-weight: 900; font-size: 1.3rem;">0.00 ETB</div>
        </div>
    </div>

    <div id="home-page" class="page active">
        <h2 style="text-align: center;">ውርርድ ይምረጡ</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn" onclick="checkBet(10)">10 ETB</button>
            <button class="btn" onclick="checkBet(50)">50 ETB</button>
            <button class="btn" onclick="checkBet(100)">100 ETB</button>
            <button class="btn" onclick="checkBet(200)">200 ETB</button>
            <button class="btn" onclick="checkBet(500)">500 ETB</button>
            <button class="btn" onclick="checkBet(1000)">1000 ETB</button>
        </div>
        <button class="btn btn-blue" onclick="showP('finance-page')">💸 ብር ለማስገባት / ለማውጣት</button>
        <button id="adm-gate" class="btn btn-red" style="display:none;" onclick="showP('admin-page')">⚙️ ዳኛ (Admin Panel)</button>
    </div>

    <div id="game-page" class="page">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
            <div id="current-ball" style="width:70px; height:70px; background:var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#000; font-size:2.2rem; font-weight:900; border:4px solid #fff;">?</div>
            <div id="ball-history" style="background:#1e293b; padding:10px; border-radius:10px; flex-grow:1; margin-left:10px; height:50px; overflow-x:auto; font-size: 14px; color:#facc15; white-space:nowrap;"></div>
        </div>
        <div id="bingo-grid" class="grid"></div>
        <button id="bingo-btn" class="btn btn-red" style="height:80px; font-size:2rem; margin-top:20px;" onclick="claimWin()">BINGO! 🏆</button>
    </div>

    <div id="reserve-page" class="page">
        <h3 style="text-align: center;">ካርቴላ ይምረጡ (1-200)</h3>
        <div id="board-list" class="board-selector"></div>
        <button class="btn btn-red" onclick="showP('home-page')">ተመለስ</button>
    </div>

    <div id="finance-page" class="page">
        <h3>ገቢና ወጪ</h3>
        <input type="number" id="f-amt" style="width:100%; padding:18px; border-radius:12px; border:none; font-size:1.2rem;" placeholder="መጠን (ETB)">
        <button class="btn btn-green" onclick="reqFinance('DEP')">ብር አስገባ (Deposit)</button>
        <button class="btn btn-red" onclick="reqFinance('WIT')">ብር አውጣ (Withdraw)</button>
        <button class="btn" style="background:#475569; color:white; margin-top:20px;" onclick="showP('home-page')">ተመለስ</button>
    </div>

    <div id="admin-page" class="page">
        <h3>Admin Control</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn" onclick="drawNum()">Draw 1</button>
            <button id="auto-btn" class="btn btn-green" onclick="toggleAutoDraw()">AUTO: OFF</button>
        </div>
        <button class="btn btn-red" onclick="resetGame()">RESET GAME</button>
        <hr>
        <h4>ገቢ/ወጪ ጥያቄዎች (Requests)</h4>
        <div id="req-list"></div>
        <button class="btn btn-blue" onclick="showP('home-page')">Back to Home</button>
    </div>
</div>

<script>
    const ADMIN_ID = 8431270634; 
    const fb = firebase.initializeApp({ databaseURL: "https://dagi-bingo-default-rtdb.firebaseio.com/" });
    const db = fb.database();
    const tg = window.Telegram.WebApp; tg.expand();

    const user = tg.initDataUnsafe.user || { id: "GUEST", first_name: "Player" };
    document.getElementById('u-name').innerText = user.first_name;
    if(user.id == ADMIN_ID) document.getElementById('adm-gate').style.display = 'block';

    let myBal = 0, myBoard = [], drawn = [], markedCells = [12], autoInterval = null;

    window.onload = () => { setTimeout(() => { document.getElementById('splash').style.display = 'none'; document.getElementById('main-ui').style.display = 'block'; }, 2000); };

    // ባላንስ ክትትል
    db.ref('users/' + user.id + '/bal').on('value', s => {
        myBal = s.val() || 0;
        document.getElementById('u-bal').innerText = myBal.toFixed(2) + " ETB";
    });

    function showP(id) { 
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); 
        document.getElementById(id).classList.add('active'); 
        if(id==='admin-page') loadRequests();
        if(id==='reserve-page') loadBoards();
    }

    // ካርቴላ ምርጫ
    function checkBet(amt) {
        if(myBal < amt) return alert("ባላንስ የለም!");
        currentBet = amt;
        showP('reserve-page');
    }

    function loadBoards() {
        db.ref('reserved_boards').on('value', s => {
            const list = document.getElementById('board-list'); list.innerHTML = "";
            const taken = s.val() || {};
            for(let i=1; i<=200; i++) {
                let b = document.createElement('div');
                b.className = "board-btn" + (taken[i] ? " reserved" : "");
                b.innerText = i;
                b.onclick = () => {
                    db.ref('reserved_boards/' + i).set({ uid: user.id, bet: currentBet });
                    db.ref('users/' + user.id + '/bal').transaction(c => (c || 0) - currentBet);
                    startBingo();
                };
                list.appendChild(b);
            }
        });
    }

    function startBingo() {
        showP('game-page');
        markedCells = [12];
        let nums = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5).slice(0, 24);
        myBoard = [];
        const grid = document.getElementById('bingo-grid'); grid.innerHTML = "";
        for(let i=0; i<25; i++) {
            let val = (i === 12) ? "FREE" : nums.pop();
            myBoard.push(val);
            let c = document.createElement('div');
            c.className = 'cell' + (val==="FREE"?" marked":"");
            c.id = 'c-'+i; c.innerText = val;
            c.onclick = () => {
                if(drawn.includes(val) || val === "FREE") {
                    if(!markedCells.includes(i)) { c.classList.add('marked'); markedCells.push(i); tg.HapticFeedback.impactOccurred('medium'); }
                }
            };
            grid.appendChild(c);
        }
    }

    // ቁጥር ማውጫ (Sync)
    db.ref('game/drawn').on('value', s => {
        drawn = s.val() || [];
        document.getElementById('current-ball').innerText = drawn[drawn.length-1] || "?";
        document.getElementById('ball-history').innerText = drawn.join(" - ");
        myBoard.forEach((v, i) => {
            const el = document.getElementById('c-'+i);
            if(el && drawn.includes(v) && !markedCells.includes(i)) el.classList.add('hint');
            else if(el) el.classList.remove('hint');
        });
    });

    // 24. Auto Draw (2 Seconds)
    function toggleAutoDraw() {
        if(autoInterval) {
            clearInterval(autoInterval); autoInterval = null;
            document.getElementById('auto-btn').innerText = "AUTO: OFF";
            document.getElementById('auto-btn').classList.replace('btn-red', 'btn-green');
        } else {
            document.getElementById('auto-btn').innerText = "AUTO: ON";
            document.getElementById('auto-btn').classList.replace('btn-green', 'btn-red');
            autoInterval = setInterval(drawNum, 2000); 
        }
    }

    function drawNum() {
        db.ref('game/drawn').once('value', s => {
            let d = s.val() || [];
            if(d.length >= 75) return clearInterval(autoInterval);
            let n; do { n = Math.floor(Math.random()*75)+1; } while(d.includes(n));
            d.push(n); db.ref('game/drawn').set(d);
        });
    }

    // 17. Finance System Active
    function reqFinance(type) {
        const amt = parseFloat(document.getElementById('f-amt').value);
        if(!amt || amt <= 0) return alert("መጠን ያስገቡ!");
        db.ref('finance_reqs').push({ uid: user.id, name: user.first_name, amount: amt, type: type });
        alert("ጥያቄው ተልኳል! ዳኛው እስኪያጸድቅ ይጠብቁ::");
    }

    function loadRequests() {
        db.ref('finance_reqs').on('value', s => {
            const list = document.getElementById('req-list'); list.innerHTML = "";
            s.forEach(child => {
                const r = child.val();
                let div = document.createElement('div');
                div.className = "req-card";
                div.innerHTML = `
                    <div><b>${r.name}</b>: ${r.amount} ETB (${r.type})</div>
                    <div style="margin-top:5px;">
                        <button class="btn-green" style="padding:5px; border:none; border-radius:5px;" onclick="approveReq('${child.key}', '${r.uid}', ${r.amount}, '${r.type}')">ፍቀድ</button>
                        <button class="btn-red" style="padding:5px; border:none; border-radius:5px;" onclick="db.ref('finance_reqs/${child.key}').remove()">ሰርዝ</button>
                    </div>
                `;
                list.appendChild(div);
            });
        });
    }

    function approveReq(key, uid, amt, type) {
        db.ref('users/' + uid + '/bal').transaction(c => type === 'DEP' ? (c || 0) + amt : (c || 0) - amt);
        db.ref('finance_reqs/' + key).remove();
        alert("ተፈቅዷል!");
    }

    function resetGame() { db.ref('game').set({drawn:[], winner:null}); db.ref('reserved_boards').remove(); }
    function claimWin() { alert("BINGO! ዳኛው ጋር ጥያቄ ተልኳል::"); }
</script>
</body>
</html>
